<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yasin Demir · Uygulamalar</title>
<style>
  :root { color-scheme: light dark; --bg:#F1F0ED; --card:#FFFFFF; --ink:#16191D; --ink2:#5F656C; --accent:#B83A0A; --line:#E6E5E1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121416; --card:#1B1E22; --ink:#ECEDEE; --ink2:#A9AFB7; --accent:#FF8A4C; --line:#2E333A; } }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px; }
  .eyebrow { font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:2px; color:var(--accent); }
  h1 { margin:8px 0 32px; font-size:32px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .card h2 { margin:0 0 6px; font-size:20px; }
  .card p { margin:0 0 14px; color:var(--ink2); line-height:1.5; }
  a { color:var(--accent); font-weight:600; text-decoration:none; margin-right:16px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">YASIN DEMIR</div>
  <h1>Uygulamalar</h1>
  <div class="card">
    <h2>Mühendis Hesaplayıcı · Engineering Calculator</h2>
    <p>Sahada en çok ihtiyaç duyulan mekanik hesaplar tek uygulamada.<br>The mechanical calculations you need most, in one app.</p>
    <a href="https://play.google.com/store/apps/details?id=com.engineeringcalculator">Google Play</a>
    <a href="https://apps.apple.com/app/id6761010498">App Store</a>
    <a href="https://yasindemir94.github.io/EngineeringCalculatorPrivacy/">Gizlilik / Privacy</a>
  </div>
</main>
</body>
</html>
